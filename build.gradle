plugins {
    id 'java'
}

group = 'br.com.conceito.bradipe'
version = '1.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly files('libs/SankhyaW-extensions.jar')

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

/* ===================== JAR 1: CadastroSimplificadoDeProduto ===================== */
tasks.register('jarCadastroSimplificado', Jar) {
    archiveBaseName = 'CadastroSimplificadoDeProduto'
    archiveVersion = version

    from(sourceSets.main.output)

    include('br/com/conceito/bradipe/actions/**')
    include('br/com/conceito/bradipe/service/**')
    include('br/com/conceito/bradipe/util/**')
}

/* ===================== JAR 2: CopiarProdutoSimilar ===================== */
tasks.register('jarCopiarProdutoSimilar', Jar) {
    archiveBaseName = 'CopiarProdutoSimilar'
    archiveVersion = version

    from(sourceSets.main.output)

    include('br/com/conceito/bradipe/actions/**')
    include('br/com/conceito/bradipe/service/**')
    include('br/com/conceito/bradipe/util/**')
}

/* ===================== JAR 3: Rules ===================== */
tasks.register('jarRules', Jar) {
    archiveBaseName = 'BloqueioPreCadastro'
    archiveVersion = version

    from(sourceSets.main.output)

    include('br/com/conceito/bradipe/rules/**')
    include('br/com/conceito/bradipe/service/**')
    include('br/com/conceito/bradipe/util/**')
}

/* build gera os três jars */
tasks.named('build') {
    dependsOn('jarCadastroSimplificado', 'jarCopiarProdutoSimilar', 'jarRules')
}

/* desabilita o jar padrão */
tasks.named('jar') {
    enabled = false
}