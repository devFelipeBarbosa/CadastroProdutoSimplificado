plugins {
    id 'java'
}

group = 'br.com.conceito.bradipe'
version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Sankhya: usar compileOnly (não empacota no jar final)
    compileOnly files('libs/SankhyaW-extensions.jar')

    // Testes (opcional)
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

/* ===================== JAR 1: Actions ===================== */
tasks.register('jarActions', Jar) {
    archiveBaseName = 'CadastroSimplificaDoProduto'
    archiveVersion = version

    from(sourceSets.main.output)

    include('br/com/conceito/bradipe/actions/**')
    include('br/com/conceito/bradipe/service/**')
    include('br/com/conceito/bradipe/util/**')
}

/* ===================== JAR 2: Rules ===================== */
tasks.register('jarRules', Jar) {
    archiveBaseName = 'BloqueioPreCadastro'
    archiveVersion = version

    from(sourceSets.main.output)

    include('br/com/conceito/bradipe/rules/**')
    include('br/com/conceito/bradipe/service/**')
    include('br/com/conceito/bradipe/util/**')
}

/* ✅ build gera os dois jars */
tasks.named('build') {
    dependsOn('jarActions', 'jarRules')
}

/* (Opcional) para não gerar o jar padrão */
tasks.named('jar') {
    enabled = false
}


